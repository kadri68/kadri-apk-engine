
name: Kadri APK Builder

on:
  workflow_dispatch:
    inputs:
      html_base64:
        description: "HTML file encoded in Base64"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-android:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Android Manifest
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('Manifest XML is valid')"

      - name: Prepare HTML project
        env:
          HTML_BASE64: ${{ inputs.html_base64 }}
        run: |
          mkdir -p app/src/main/assets/www

          if [ -n "$HTML_BASE64" ]; then
            python3 - <<'PY'
          import os
          import base64

          raw = os.environ["HTML_BASE64"]
          html = base64.b64decode(raw, validate=True)

          if len(html) > 40000:
              raise SystemExit("HTML file exceeds 40 KB")

          with open("app/src/main/assets/www/index.html", "wb") as f:
              f.write(html)

          print("Uploaded HTML prepared successfully")
          PY
          else
            cp input/index.html app/src/main/assets/www/index.html
            echo "Using test HTML file"
          fi

      - name: Build APK
        run: gradle assembleDebug

      - name: Build AAB
        run: gradle bundleRelease

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: Kadri-APK-AAB
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
