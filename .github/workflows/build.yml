
name: Kadri APK Builder

on:
  workflow_dispatch:
    inputs:
      html_base64:
        description: "HTML file encoded in Base64"
        required: false
        type: string
      config_base64:
        description: "App configuration encoded in Base64"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-android:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare HTML and app configuration
        env:
          HTML_BASE64: ${{ inputs.html_base64 }}
          CONFIG_BASE64: ${{ inputs.config_base64 }}
        run: |
          python3 - <<'PY'
          import os
          import base64
          import json
          import xml.etree.ElementTree as ET

          raw_html = os.environ.get("HTML_BASE64", "")
          raw_config = os.environ.get("CONFIG_BASE64", "")

          if raw_html:
              html = base64.b64decode(raw_html, validate=True)
          else:
              with open("input/index.html", "rb") as f:
                  html = f.read()

          if len(html) > 40000:
              raise SystemExit("HTML file exceeds 40 KB")

          os.makedirs("app/src/main/assets/www", exist_ok=True)

          with open("app/src/main/assets/www/index.html", "wb") as f:
              f.write(html)

          config = {}

          if raw_config:
              config_bytes = base64.b64decode(raw_config, validate=True)
              config = json.loads(config_bytes.decode("utf-8"))

          with open("build-config.json", "w", encoding="utf-8") as f:
              json.dump(config, f, ensure_ascii=False, indent=2)

          manifest_path = "app/src/main/AndroidManifest.xml"
          tree = ET.parse(manifest_path)
          root = tree.getroot()

          android_ns = "{http://schemas.android.com/apk/res/android}"

          allow_internet = config.get("internet", True)

          if not allow_internet:
              for item in list(root):
                  if (
                      item.tag == "uses-permission"
                      and item.get(android_ns + "name")
                      == "android.permission.INTERNET"
                  ):
                      root.remove(item)

          ET.register_namespace(
              "android",
              "http://schemas.android.com/apk/res/android"
          )

          tree.write(
              manifest_path,
              encoding="utf-8",
              xml_declaration=True
          )

          print("HTML prepared successfully")
          print("App configuration prepared successfully")
          print("Internet permission:", allow_internet)
          PY

      - name: Validate Android Manifest
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('Manifest XML is valid')"

      - name: Build APK
        run: gradle assembleDebug

      - name: Build AAB
        run: gradle bundleRelease

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: Kadri-APK-AAB
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
